[workspace]
resolver = "2"
members = [
    "crates/nct-core",
    "crates/nct-fs",
    "crates/nct-git",
    "crates/nct-proc",
    "crates/nct-net",
    "crates/nct-semantic",
    "crates/nct-agent",
    "crates/nct-mcp",
]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
regex = "1"
fancy-regex = "0.13"
ureq = { version = "2", features = ["json", "gzip"] }
scraper = "0.20"
url = "2"
encoding_rs = "0.8"
dunce = "1"
pathdiff = "0.2"
indexmap = "2"
toml = "0.8"
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = "0.21"
safetensors = "0.4"

[profile.release]
lto = "thin"
strip = true

[workspace.lints.rust]
non_snake_case = "allow"
